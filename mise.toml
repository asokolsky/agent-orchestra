[tools]
uv = 'latest'

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.venv]
description = "Set a virtual environment for the project"
run = [
    'uv sync --group dev'
]

[tasks.agent-orchestra]
description = "Run agent-orchestra"
depends = ["venv"]
run = [
    'uv run python -m agent_orchestra'
]

[tasks.build]
description = "Build source and wheel distributions"
run = [
    'uv build'
]

[tasks.clean]
description = "Do local clean-up"
run = [
    'rm -rf .mypy_cache .pytest_cache .ruff_cache .venv build dist src/agent_orchestra.egg-info',
    'find . -name __pycache__ | xargs rm -rf'
]

[tasks.format]
description = "Format python sources"
run = [
    # sort imports
    'uv run ruff check --select I --fix src/agent_orchestra tests',
    # reformat sources
    'uv run ruff format -v src/agent_orchestra tests',
]

[tasks.format-check]
description = "Verify python sources are formatted without modifying them"
run = [
    # verify import order
    'uv run ruff check --select I src/agent_orchestra tests',
    # verify formatting
    'uv run ruff format --check src/agent_orchestra tests',
]

[tasks.lint]
description = "Lint python sources"
run = [
    # check imports
    'uv run ruff check -v --select I src/agent_orchestra tests',
    'uv run ruff check -v src/agent_orchestra tests'
]

[tasks.mypy]
description = "Check typing"
run = [
    'uv run mypy src/agent_orchestra tests'
]

[tasks.tests]
description = "Execute unit tests across parallel workers"
run = [
    # worksteal, not the default load scheduler. This suite waits on real child
    # processes and deliberate timeout sleeps, so its per-test cost is very
    # uneven: 56% of the measured work sits in 40 of 341 tests. Work stealing
    # empirically keeps workers busier on that distribution. Measured on 14
    # CPUs: 21.2s at 268% CPU with load, 15.2s at 346% with worksteal, same
    # 622 passed. Raising workers instead was worse (-n 24 gave 18.1s).
    'uv run pytest -n auto --dist worksteal tests',
]

[tasks.tests-serial]
description = "Execute unit tests in one process for readable failure output"
run = [
    'uv run pytest -v -p no:xdist tests',
]
