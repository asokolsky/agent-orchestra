name: CI

on:
  push:
  pull_request:

# Superseded runs of the same branch are cancelled, so only the newest commit is
# built. The event name is part of the key because a push and its pull request
# are distinct required checks: sharing one group made the push run cancel
# itself against the pull_request run and report a cancelled check. The source
# repository is part of the key so a fork branch that shares a name cannot
# cancel an unrelated run.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: format, lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # mise owns the toolchain so CI resolves the same versions as local
      # development instead of drifting from a runner default.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.2
          cache: true

      - name: Install dependencies
        run: mise run venv

      # Verifies formatting without rewriting the tree, so a badly formatted
      # branch fails here instead of during review.
      - name: Check formatting
        run: mise run format-check

      - name: Lint
        run: mise run lint

      - name: Check typing
        run: mise run mypy

      # test_claude_cli_accepts_isolation_options skips itself when the Claude
      # CLI is absent, which it is on a runner, and when the CLI cannot load
      # organization-managed settings. No exclusion list is maintained here.
      - name: Run tests
        run: mise run tests

      - name: Build distributions
        run: mise run build

      - name: Verify distributions
        run: mise run verify-dist
