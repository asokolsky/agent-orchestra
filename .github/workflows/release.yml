name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the released tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install the project toolchain
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          version: 2026.9.2
          cache: true

      - name: Install dependencies
        run: mise run venv

      - name: Check release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: mise run verify-release-tag -- "$RELEASE_TAG"

      - name: Check formatting
        run: mise run format-check

      - name: Lint
        run: mise run lint

      - name: Check typing
        run: mise run mypy

      - name: Run tests
        run: mise run tests

      - name: Build distributions
        run: mise run build

      - name: Verify distributions
        run: mise run verify-dist

      - name: Upload verified distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: pypi
      url: https://pypi.org/project/py-agent-orchestra/
    permissions:
      id-token: write

    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-distributions
          path: dist/

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@ecb4c3dfd4790f14e30aaeac04855c7413ee9368 # v1.12.2
